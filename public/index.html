<!DOCTYPE html>
<html lang="sv">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Träningslogg</title>
<meta name="theme-color" content="#17181a">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="Träning">
<link rel="manifest" href="manifest.webmanifest">
<link rel="apple-touch-icon" href="icon-180.png">
<link rel="icon" href="icon-512.png">

<link href="https://fonts.googleapis.com/css2?family=Barlow+Condensed:wght@600;700&family=Barlow:wght@400;500;600&display=swap" rel="stylesheet">
<style>
/* VOICE everyday: a training logbook you actually use between sets
   IDEA gym floor and bumper plates: black rubber band, plate colours mark session types
   PICTURE the year as a training grid, every day a cell coloured by session type, planned days outlined
   COLOUR white ground, rubber black band, plate red / blue / green / yellow
   TYPE Barlow Condensed (gym signage) + Barlow
   LAYOUT band with title, stats and year grid across full width; sticky tabs; one working column below */
:root{color-scheme:light dark;--bg:light-dark(#ffffff,#121314);--ink:light-dark(#141516,#ecebe8);--soft:light-dark(#5d6168,#a3a7ad);--line:light-dark(#e3e4e6,#2b2d31);--panel:light-dark(#f5f5f6,#1b1c1f);--rub:#17181a;--rub2:#2a2c30;--red:#d7263d;--blue:#2563c9;--green:#2a9d4b;--yellow:#f2b705;--grey:#8a8f98}
:root[data-theme=light]{color-scheme:light}:root[data-theme=dark]{color-scheme:dark}
*{box-sizing:border-box;min-width:0}
html,body{margin:0}
body{background:var(--bg);color:var(--ink);font:16px/1.5 Barlow,system-ui,sans-serif;overflow-x:clip}
h1,h2,h3{font-family:"Barlow Condensed",Barlow,sans-serif;font-weight:700;letter-spacing:-.01em;line-height:1.05;margin:0}
.band{background:var(--rub);color:#f3f2ef;padding:calc(20px + env(safe-area-inset-top,0px)) max(4vw,16px,env(safe-area-inset-right,0px)) 16px max(4vw,16px,env(safe-area-inset-left,0px))}
.top{display:flex;flex-wrap:wrap;align-items:flex-end;justify-content:space-between;gap:12px 28px;max-width:1240px;margin:0 auto 14px}
.top h1{font-size:clamp(34px,5vw,48px)}
.top p{margin:2px 0 0;color:#b9bcc2;font-size:15px}
.stats{display:flex;flex-wrap:wrap;gap:6px 26px}
.stat b{display:block;font:700 30px/1 "Barlow Condensed",sans-serif}
.stat span{font-size:13px;color:#b9bcc2}
.gridwrap{max-width:1240px;margin:0 auto;overflow-x:auto;scrollbar-width:thin}
.gridwrap svg{display:block}
.gridwrap text{fill:#9ea2a8;font:13px Barlow,sans-serif}
.legend{max-width:1240px;margin:10px auto 0;display:flex;flex-wrap:wrap;gap:6px 16px;font-size:13px;color:#b9bcc2}
.legend i{display:inline-block;width:11px;height:11px;border-radius:2px;margin-right:6px;vertical-align:-1px}
nav{position:sticky;top:0;z-index:5;background:var(--bg);border-bottom:1px solid var(--line)}
nav div{max-width:1240px;margin:0 auto;display:flex;gap:4px;padding:0 max(4vw,16px);overflow-x:auto}
nav a{flex:none;padding:13px 14px 11px;color:var(--soft);text-decoration:none;font-weight:600;border-bottom:3px solid transparent}
nav a.on{color:var(--ink);border-color:var(--red)}
#sync{margin-left:auto;align-self:center;font-size:13px;color:var(--soft);flex:none;padding-left:10px}
main{max-width:1240px;margin:0 auto;padding:20px max(4vw,16px) 60px}
.row{display:flex;flex-wrap:wrap;gap:10px;align-items:center}
.sp{flex:1}
button,.btn{font:600 15px Barlow,sans-serif;min-height:44px;padding:0 16px;border-radius:8px;border:1px solid var(--line);background:var(--panel);color:var(--ink);cursor:pointer}
button:hover{border-color:var(--soft)}
button:focus-visible,input:focus-visible,select:focus-visible,textarea:focus-visible,nav a:focus-visible{outline:3px solid var(--blue);outline-offset:2px}
button.pri{background:var(--ink);color:var(--bg);border-color:var(--ink)}
button.dan{color:var(--red)}
button.sm{min-height:36px;padding:0 12px;font-size:14px}
input,select,textarea{font:16px Barlow,sans-serif;color:var(--ink);background:var(--bg);border:1px solid color-mix(in srgb,var(--soft) 55%,transparent);border-radius:8px;padding:9px 11px;min-height:44px;width:100%}
label{font-size:14px;color:var(--soft);display:block;margin-bottom:4px}
.chip{display:inline-block;font:700 14px/1 "Barlow Condensed",sans-serif;padding:5px 8px 4px;border-radius:4px;color:#fff;white-space:nowrap}
.chip.y{color:#17181a}
.week h2{font-size:30px}
.day{display:grid;grid-template-columns:86px minmax(0,1fr);gap:14px;padding:14px 0;border-top:1px solid var(--line)}
.day.today .dn{color:var(--red)}
.dn b{display:block;font:700 22px/1 "Barlow Condensed",sans-serif}
.dn span{font-size:14px;color:var(--soft)}
.card{border:1px solid var(--line);border-radius:10px;padding:12px 14px;margin-bottom:8px;background:var(--bg)}
.card.plan{border-style:dashed;background:var(--panel)}
.card h3{font-size:20px;display:flex;gap:8px;align-items:center;flex-wrap:wrap}
.ex{display:grid;grid-template-columns:minmax(0,15em) minmax(0,1fr);gap:2px 14px;font-size:15px;margin-top:6px}
.ex div:nth-child(odd){font-weight:600}
.ex div:nth-child(even){color:var(--soft)}
.muted{color:var(--soft);font-size:14px}
.ed{background:var(--panel);border:1px solid var(--line);border-radius:12px;padding:16px;margin-bottom:18px}
.ed h2{font-size:28px;margin-bottom:12px}
.f3{display:grid;grid-template-columns:repeat(auto-fit,minmax(12em,1fr));gap:12px;margin-bottom:12px}
.er{display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1.3fr) 44px;gap:8px;align-items:start;padding:10px 0;border-top:1px solid var(--line)}
.er .hint{grid-column:1/-1;font-size:14px;color:var(--soft);margin-top:-2px}
.er .hint b{color:var(--ink)}
.er .hint button{margin-left:6px}
.x{padding:0;min-height:44px;width:44px;font-size:20px}
.rirl{display:inline-flex;align-items:center;gap:6px;margin:0 12px 4px 0;font-size:14px;color:var(--soft)}
.rirl select{width:auto;min-height:36px;padding:4px 8px}
.swapw{position:relative;display:inline-block;margin-left:8px;font-size:13px;font-weight:400;color:var(--soft);text-decoration:underline;text-decoration-color:color-mix(in srgb,currentColor 40%,transparent);cursor:pointer}
.swapw select{position:absolute;inset:0;opacity:0;width:100%;cursor:pointer;font-size:16px}
.muslist{list-style:none;padding:0;margin:0 0 6px}
.muslist>li{display:grid;grid-template-columns:minmax(0,1.2fr) minmax(0,1.6fr) auto;gap:8px;align-items:baseline;padding:7px 0;border-top:1px solid var(--line)}
.muslist .mus{font-size:14px}
.muslist>li.musform{display:block}
.chks{display:flex;flex-wrap:wrap;gap:4px 12px}
.chk{display:flex;gap:5px;align-items:center;font-size:14px;margin:0;font-weight:400}
@media (max-width:600px){.muslist>li{grid-template-columns:1fr auto}.muslist .mus{grid-column:1/-1;order:3}}
.src{grid-column:1/-1;font-size:12px;color:var(--soft);opacity:.85;margin-top:1px}
.src a{color:inherit;text-decoration:underline;text-decoration-color:color-mix(in srgb,currentColor 40%,transparent)}
.goalopt{display:grid;grid-template-columns:auto minmax(0,1fr);gap:4px 10px;align-items:start;padding:10px 0;border-top:1px solid var(--line);cursor:pointer}
.goalopt:first-of-type{border-top:0}
.goalopt input{width:22px;height:22px;min-height:0;margin:2px 0 0}
.goalopt b{font-size:17px}
.goalopt span{grid-column:2;color:var(--soft);font-size:14px}
.freq{display:grid;grid-template-columns:4.5em minmax(0,1fr) 3em;gap:6px 10px;align-items:center;font-size:15px}
.freq .bar{position:relative;height:14px;background:var(--panel);border-radius:3px}
.freq .bar i{position:absolute;left:0;top:0;bottom:0;border-radius:3px;background:var(--ink)}
.freq .bar u{position:absolute;top:-3px;bottom:-3px;border-left:2px dashed color-mix(in srgb,var(--green) 80%,transparent)}
.freq b{text-align:right;font-variant-numeric:tabular-nums}
.refs{font-size:14px;color:var(--soft);padding-left:18px}.refs li{margin-bottom:4px}.refs a{color:var(--blue)}
.paste{border-top:1px solid var(--line);border-bottom:1px solid var(--line);padding:12px 0;margin:8px 0}
.paste textarea{min-height:140px;font:15px/1.4 Barlow,sans-serif}
button.sm.on{background:var(--ink);color:var(--bg)}
.fil{display:flex;flex-wrap:wrap;gap:8px;margin-bottom:14px}
.fil button.on{background:var(--ink);color:var(--bg)}
.prog{display:grid;grid-template-columns:repeat(auto-fit,minmax(9em,1fr));gap:12px;margin:14px 0}
.prog div{border-top:3px solid var(--line);padding-top:6px}
.prog div:first-child{border-color:var(--red)}
.prog b{display:block;font:700 30px/1.05 "Barlow Condensed",sans-serif;white-space:nowrap}
.fig{position:relative;height:340px;margin:8px 0 18px}
.fig>svg{position:absolute;inset:0;width:100%;height:100%}
.fig text{font:13px Barlow,sans-serif;fill:var(--soft)}
.scroll{overflow-x:auto}
table{border-collapse:collapse;width:100%;font-size:15px}
th,td{text-align:left;padding:8px 10px;border-bottom:1px solid var(--line);vertical-align:top}
th{font-weight:600;color:var(--soft)}
td.n{text-align:right;white-space:nowrap;font-variant-numeric:tabular-nums}
.note{background:var(--panel);border-radius:10px;padding:14px 16px;margin-top:20px;font-size:15px}
textarea{min-height:160px;font-size:14px}
.empty{padding:30px 0;color:var(--soft)}
.hero{display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1.4fr);gap:20px 28px;border:1px solid var(--line);border-radius:14px;padding:18px;margin-bottom:22px}
.hero h2{font-size:clamp(30px,4vw,42px);margin:6px 0 8px}
.hero .chip{font-size:16px;padding:6px 10px 5px}
.warnbox{background:color-mix(in srgb,var(--yellow) 22%,transparent);border-radius:8px;padding:8px 12px;margin:8px 0;font-size:15px}
.pl{list-style:none;margin:0;padding:0}
.pl li{display:grid;grid-template-columns:minmax(0,1fr) auto;gap:2px 12px;padding:9px 0;border-top:1px solid var(--line)}
.pl li:first-child{border-top:0}
.pl b{font-variant-numeric:tabular-nums;white-space:nowrap;font-size:17px}
.pl small{grid-column:1/-1;color:var(--soft);font-size:14px}
.k{display:inline-block;font-size:12px;font-weight:600;border-radius:4px;padding:1px 6px;margin-left:6px;vertical-align:1px;background:var(--panel);color:var(--soft);white-space:nowrap}
.k.weight,.k.reps,.k.time{background:color-mix(in srgb,var(--green) 18%,transparent);color:light-dark(#1d6e35,#7fd69a)}
.k.plateau,.k.comeback{background:color-mix(in srgb,var(--yellow) 28%,transparent);color:light-dark(#7a5a00,#f5cf63)}
.notes{list-style:none;padding:0;margin:0 0 24px}
.notes li{position:relative;padding:8px 0 8px 22px;border-top:1px solid var(--line)}
.notes li::before{content:"";position:absolute;left:2px;top:15px;width:10px;height:10px;border-radius:50%;background:var(--grey)}
.notes li.warn::before{background:var(--yellow)}.notes li.good::before{background:var(--green)}
.cols{display:grid;grid-template-columns:repeat(auto-fit,minmax(min(100%,300px),1fr));gap:22px;margin-bottom:24px}
.cols h3{font-size:22px;margin-bottom:6px}
.wk{display:grid;grid-template-columns:repeat(12,minmax(0,1fr));gap:6px;align-items:end;height:150px;margin-top:8px}
.wk div{display:flex;flex-direction:column-reverse;gap:2px;height:100%;position:relative}
.wk i{display:block;border-radius:2px;min-height:0}
.wk span{position:absolute;bottom:-20px;left:0;right:0;text-align:center;font-size:12px;color:var(--soft)}
.vol{display:grid;grid-template-columns:4.5em minmax(0,1fr) 3em;gap:6px 10px;align-items:center;font-size:15px}
.vol .bar{position:relative;height:14px;background:var(--panel);border-radius:3px}
.vol .bar i{position:absolute;left:0;top:0;bottom:0;border-radius:3px;background:var(--ink)}
.vol .bar u{position:absolute;top:-3px;bottom:-3px;border-left:2px dashed color-mix(in srgb,var(--green) 70%,transparent);border-right:2px dashed color-mix(in srgb,var(--green) 70%,transparent);background:color-mix(in srgb,var(--green) 10%,transparent)}
.vol b{text-align:right;font-variant-numeric:tabular-nums}
.tl{list-style:none;padding:0;margin:0}
.tl li{display:flex;justify-content:space-between;gap:10px;padding:7px 0;border-top:1px solid var(--line);font-size:15px}
.tl li:first-child{border-top:0}
.tl a{color:var(--ink);text-decoration:none;font-weight:600}
.tl em{font-style:normal;color:var(--soft);white-space:nowrap;font-variant-numeric:tabular-nums}
body.out nav,body.out #gw,body.out #legend,body.out #stats{display:none}
.usertab{flex:none}
.badge[hidden]{display:none}
.badge{display:inline-block;min-width:20px;height:20px;padding:0 6px;border-radius:10px;background:var(--red);color:#fff;font:700 12px/20px Barlow,sans-serif;text-align:center;vertical-align:2px}
.taskbar{display:flex;flex-wrap:wrap;align-items:center;gap:10px;border:2px solid var(--red);border-radius:10px;padding:10px 14px;margin-bottom:14px}
.taskbar b{color:var(--red)}
.linkbox{display:flex;flex-wrap:wrap;gap:8px;align-items:center;background:var(--panel);border-radius:10px;padding:12px 14px;margin:0 0 14px}
.linkbox code{flex:1 1 260px;font-size:14px;overflow-wrap:anywhere}
tr.hl td{background:color-mix(in srgb,var(--yellow) 12%,transparent)}
#sync{margin-left:auto}
.authwrap{max-width:440px;margin:10px auto 40px}
.authwrap h2{font-size:34px;margin-bottom:6px}
.authwrap form{display:grid;gap:12px;margin-top:14px}
.authwrap .two{display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1fr);gap:12px}
.links{display:flex;flex-wrap:wrap;gap:6px 18px;margin-top:14px;font-size:15px}
.links a,.linkbtn{color:var(--blue);text-decoration:underline;background:none;border:0;padding:0;min-height:0;font:inherit;cursor:pointer}
.flash{border-radius:10px;padding:10px 14px;margin:0 0 14px;font-size:15px}
.flash.ok{background:color-mix(in srgb,var(--green) 16%,transparent)}
.flash.err{background:color-mix(in srgb,var(--red) 14%,transparent)}
.rules{list-style:none;padding:0;margin:2px 0 0;font-size:14px;color:var(--soft)}
.rules li::before{content:"○ ";}
.rules li.ok{color:light-dark(#1d6e35,#7fd69a)}.rules li.ok::before{content:"● "}
.panel{border:1px solid var(--line);border-radius:12px;padding:16px;margin-bottom:18px}
.panel h2{font-size:26px;margin-bottom:10px}
.panel form{display:grid;gap:12px;max-width:520px}
.tag2{display:inline-block;font-size:12px;font-weight:600;padding:2px 7px;border-radius:4px;background:var(--panel);color:var(--soft);white-space:nowrap}
.tag2.g{background:color-mix(in srgb,var(--green) 18%,transparent);color:light-dark(#1d6e35,#7fd69a)}
.tag2.r{background:color-mix(in srgb,var(--red) 16%,transparent);color:light-dark(#a01729,#ff8a96)}
.tag2.y{background:color-mix(in srgb,var(--yellow) 28%,transparent);color:light-dark(#7a5a00,#f5cf63)}
td .row{gap:6px}
.coachbar{display:flex;flex-wrap:wrap;align-items:center;gap:10px;background:var(--panel);border-radius:10px;padding:10px 14px;margin-bottom:14px}
@media(max-width:700px){.hero{grid-template-columns:1fr}}
@media(max-width:600px){.authwrap .two{grid-template-columns:1fr}.day{grid-template-columns:1fr;gap:6px}.dn b{display:inline;margin-right:8px}.ex{grid-template-columns:1fr}.ex div:nth-child(even){margin-bottom:4px}.er{grid-template-columns:minmax(0,1fr) 44px}.er .sets{grid-column:1/2;grid-row:2}.fig{height:260px}table{font-size:13px}th,td{padding:6px 5px}}
</style>
</head>
<body>
<header class="band">
  <div class="top">
    <div><h1 data-i18n="Träningslogg">Träningslogg</h1><p data-i18n="Planera veckan, logga passet, se vikterna stiga.">Planera veckan, logga passet, se vikterna stiga.</p></div>
    <div class="stats" id="stats"></div>
  </div>
  <div class="gridwrap" id="gw"></div>
  <div class="legend" id="legend"></div>
</header>
<nav><div id="tabs">
  <a href="#plan" data-v="plan"><span data-i18n="Plan">Plan</span></a>
  <a href="#coach" data-v="coach"><span data-i18n="Coach">Coach</span></a>
  <a href="#log" data-v="log"><span data-i18n="Logga pass">Logga pass</span></a>
  <a href="#history" data-v="history"><span data-i18n="Historik">Historik</span></a>
  <a href="#progress" data-v="progress"><span data-i18n="Utveckling">Utveckling</span></a>
  <a href="#admin" data-v="admin" id="admintab" hidden><span data-i18n="Admin">Admin</span> <span class="badge" id="adminbadge" hidden></span></a>
  <span id="sync"></span>
  <a href="#settings" data-v="settings" id="usertab" class="usertab">Inställningar</a>
</div></nav>
<main id="main"></main>
<script type="module">
import { parseSets, parseSessionText } from "./parse.js";
import { setMuscleOverrides, MUSCLES, musclesOf } from "./muscles.js";
import { coachReport, nextTarget, history as exHistory, SOURCES, GOALS, effectiveTag, allocSets, withSets, fitToTime } from "./coach.js";
import { t as _, tn as _n, setLang, getLang, detectLang, LANGS, weekdays, months, fmtNum, tagShort, tagName } from "./i18n.js";
{
// Colours per session type; labels come from i18n (tagShort/tagName).
const TAGS={"ÖK":[null,"red"],"NK":[null,"blue"],"HK":[null,"yellow"],"":[null,"grey"]};
const MERGE={"UK":"NK","FK":"HK"};const normTag=t=>MERGE[t]||t||"";
let me=null,authMode="login",authMsg=null,resetToken=null,adminData=null,flash=null,sessions=[],plans=[],muscles={},swaps={},db=null,view="plan",weekOff=0,ed=null,filt={tag:"*",q:""},progEx=null,armed=null;
const $=id=>document.getElementById(id);
const esc=s=>String(s??"").replace(/[&<>"']/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));
const num=s=>parseFloat(String(s).replace(",","."));
const fmt=fmtNum;
const pad=n=>String(n).padStart(2,"0");
const ds=d=>`${d.getUTCFullYear()}-${pad(d.getUTCMonth()+1)}-${pad(d.getUTCDate())}`;
const pd=s=>{const[a,b,c]=s.split("-").map(Number);return new Date(Date.UTC(a,b-1,c))};
const now=new Date();const TODAY=ds(new Date(Date.UTC(now.getFullYear(),now.getMonth(),now.getDate())));
const addD=(s,n)=>{const d=pd(s);d.setUTCDate(d.getUTCDate()+n);return ds(d)};
const dow=s=>(pd(s).getUTCDay()+6)%7;
const monday=s=>addD(s,-dow(s));
const isoWeek=s=>{const d=pd(s);d.setUTCDate(d.getUTCDate()+3-dow(s));const y=new Date(Date.UTC(d.getUTCFullYear(),0,4));return 1+Math.round(((d-y)/864e5-3+((y.getUTCDay()+6)%7))/7)};
const nice=s=>{const d=pd(s);return getLang()==="en"?`${weekdays()[dow(s)]} ${months()[d.getUTCMonth()]} ${d.getUTCDate()}`:`${weekdays()[dow(s)]} ${d.getUTCDate()} ${months()[d.getUTCMonth()]}`};
const chip=t=>{const k=TAGS[t]?t:"";return `<span class="chip ${TAGS[k][1]==="yellow"?"y":""}" style="background:var(--${TAGS[k][1]})">${esc(tagShort(k))}</span>`};
// Static texts in the page markup carry data-i18n with the Swedish source text.
function applyStatic(){document.querySelectorAll("[data-i18n]").forEach(el=>{el.textContent=_(el.dataset.i18n)});document.title=_("Träningslogg")}
const mmss=t=>`${Math.floor(t/60)}:${pad(t%60)}`;

const topSet=sets=>{const ws=sets.filter(s=>s.w!=null&&s.r);return ws.length?ws.reduce((a,b)=>b.w>a.w||(b.w===a.w&&b.r>a.r)?b:a):null};
const e1rm=s=>s&&s.w>0?s.w*(1+Math.min(s.r,12)/30):null;

function exIndex(){const m=new Map();for(const s of [...sessions].sort((a,b)=>a.date<b.date?-1:1))for(const e of s.ex||[]){if(!e.n)continue;if(!m.has(e.n))m.set(e.n,[]);m.get(e.n).push({date:s.date,s:e.s||"",sid:s.id})}return m}
function lastFor(n,before){const l=exIndex().get(n)||[];for(let i=l.length-1;i>=0;i--)if(!before||l[i].date<before)return l[i];return null}
const goalNow=()=>me?.goal||"muscle";
const minNow=()=>me?.sessionMin||40;
// Exercises the user swapped in today's coach proposal ({original: chosen}).
const swapKey=()=>me?"gymlog-swaps-"+me.id:"";
function loadSwaps(){try{const s=JSON.parse(localStorage.getItem(swapKey())||"null");swaps=s&&s.d===TODAY?s.m:{}}catch(e){swaps={}}}

document.addEventListener("submit",async ev=>{
  const f=ev.target.closest("form[data-form]");if(!f)return;ev.preventDefault();
  const k=f.dataset.form,v=Object.fromEntries(new FormData(f));const btn=f.querySelector("button.pri");if(btn)btn.disabled=true;
  const done=()=>{if(btn)btn.disabled=false};

  try{
    if(k==="login"){const r=await api("auth/login",{method:"POST",body:JSON.stringify({email:v.email,password:v.password})});await afterLogin(r.user);return}
    if(k==="register"){if(v.password!==v.password2){setA("err","Lösenorden är inte lika.");return}
      const r=await api("auth/register",{method:"POST",body:JSON.stringify({...v,lang:getLang()})});authMode="login";setA("ok",r.message);return}
    if(k==="forgot"){const r=await api("auth/forgot",{method:"POST",body:JSON.stringify({email:v.email})});authMode="login";setA("ok",r.message);return}
    if(k==="reset"){if(v.password!==v.password2){setA("err","Lösenorden är inte lika.");return}

let ro=null;
function drawChart(wt){
  const s=$("csvg");if(!s||wt.length<1)return;
  const draw=()=>{const W=s.clientWidth,H=s.clientHeight;if(!W)return;const m={l:44,r:58,t:14,b:28};
    const t0=pd(wt[0].date).getTime(),t1=Math.max(pd(wt[wt.length-1].date).getTime(),t0+864e5*7);
    const vals=wt.flatMap(r=>[r.t.w,r.e1||r.t.w]);let lo=Math.min(...vals),hi=Math.max(...vals);const pd2=(hi-lo)*.12||5;lo=Math.max(lo<0?lo-pd2:0,lo-pd2);hi+=pd2;
    const X=d=>m.l+(pd(d).getTime()-t0)/(t1-t0)*(W-m.l-m.r),Y=v=>m.t+(hi-v)/(hi-lo)*(H-m.t-m.b);
    const stp=[1,2.5,5,10,20,25,50].find(k=>(hi-lo)/k<=5)||100;let g="";
    for(let v=Math.ceil(lo/stp)*stp;v<=hi;v+=stp)g+=`<line x1="${m.l}" x2="${W-m.r}" y1="${Y(v)}" y2="${Y(v)}" stroke="var(--line)"/><text x="${m.l-8}" y="${Y(v)+4}" text-anchor="end">${fmt(v)}</text>`;
    const d0=pd(wt[0].date);let mo=new Date(Date.UTC(d0.getUTCFullYear(),d0.getUTCMonth()+1,1)),k=0;
    while(mo.getTime()<=t1){if(W>=520||k%2===0)g+=`<text x="${X(ds(mo))}" y="${H-8}" text-anchor="middle">${months()[mo.getUTCMonth()]}</text>`;mo=new Date(Date.UTC(mo.getUTCFullYear(),mo.getUTCMonth()+1,1));k++}
    const e=wt.filter(r=>r.e1);const ln=(a,f)=>a.map((r,i)=>`${i?"L":"M"}${X(r.date).toFixed(1)},${Y(f(r)).toFixed(1)}`).join("");
    g+=`<path d="${ln(e,r=>r.e1)}" fill="none" stroke="var(--soft)" stroke-width="1.5" stroke-dasharray="4 4"/>`;
    g+=`<path d="${ln(wt,r=>r.t.w)}" fill="none" stroke="var(--red)" stroke-width="2.5" stroke-linejoin="round"/>`;
    g+=wt.map(r=>`<circle cx="${X(r.date)}" cy="${Y(r.t.w)}" r="4" fill="var(--red)"><title>${nice(r.date)}: ${r.t.r}@${fmt(r.t.w)}</title></circle>`).join("");
    const L=wt[wt.length-1];g+=`<text x="${X(L.date)+8}" y="${Y(L.t.w)+4}" style="fill:var(--red);font-weight:600">${_("Toppset")}</text>`;
    if(L.e1)g+=`<text x="${X(L.date)+8}" y="${Y(L.e1)+(Math.abs(Y(L.e1)-Y(L.t.w))<16?-12:4)}">1RM</text>`;
    s.innerHTML=g};
  if(ro)ro.disconnect();ro=new ResizeObserver(draw);ro.observe(s);draw();
}

  else if(a==="ft"){filt.tag=b.dataset.t;render()}
  else if(a==="copy"){const txt=[...sessions].sort((x,y)=>x.date<y.date?-1:1).map(s=>`${s.date.slice(2).replace(/-/g,"")}${s.tag?" "+tagShort(s.tag):""}${s.note?` (${s.note})`:""}\n`+(s.ex||[]).map(e=>`${e.n} ${e.s}${e.r!==null&&e.r!==undefined?" RIR "+e.r:""}`).join("\n")).join("\n\n");
    try{await navigator.clipboard.writeText(txt);setSync("Kopierat")}catch(e){$("copyout").innerHTML=`<label for="cpt">${_("Markera och kopiera")}</label><textarea id="cpt">${esc(txt)}</textarea>`}}
});
document.addEventListener("input",ev=>{if(ev.target.id==="pastetxt"&&ed){ed.pasteText=ev.target.value;return}if(ev.target.id==="hq"){filt.q=ev.target.value;const p=ev.target.selectionStart;render();const i=$("hq");i.focus();i.setSelectionRange(p,p)}});
document.addEventListener("change",ev=>{const t=ev.target;
  if(t.id==="pex"){progEx=t.value.replace(/ \(\d+\)$/,"");render()}
  else if(t.dataset.swap){swaps[t.dataset.swap]=t.value;saveSwaps();render()}
  else if(t.dataset.f==="n"||t.id==="e-date"){syncEd();rerow()}});
window.addEventListener("hashchange",route);

boot();
}
</script>
</body>
